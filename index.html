<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Real Estate | Audit Systémique France</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- API Calendly - Rétention du prospect dans l'écosystème -->
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&family=Inter:wght@300;400;500;600;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #020617 0%, #0a0f24 50%, #17113a 100%); 
            color: white; 
            overflow: hidden; 
        }
        .font-title { font-family: 'Montserrat', sans-serif; }
        
        .text-gradient-platinum {
            background: linear-gradient(to bottom, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-enter { animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        .input-quantum {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            transition: all 0.3s ease;
        }
        .input-quantum:focus {
            border-color: #60a5fa;
            background: rgba(255,255,255,0.05);
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.2);
            outline: none;
        }

        .glitch-text { color: #ef4444; font-weight: 900; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.3); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.8); }

        /* Table Styles for Comparison */
        .quantum-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .quantum-table th { background: rgba(255,255,255,0.05); padding: 1rem; text-align: left; font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.1em; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .quantum-table td { padding: 1.2rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.95rem; }
        .quantum-table tr:hover { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body class="w-full h-screen flex flex-col relative bg-gradient-to-br from-[#020617] via-[#0a0f24] to-[#17113a]">

    <div class="absolute top-8 left-8 z-50 animate-enter pointer-events-none flex flex-col items-start">
        <img src="https://i.ibb.co/C3KXLBJM/Quantum-1.png" alt="Quantum" class="h-16 md:h-24 object-contain drop-shadow-[0_0_20px_rgba(255,255,255,0.15)] mb-1">
        <p class="text-[8px] uppercase tracking-[0.4em] text-gray-400 font-bold ml-2">France // 2026</p>
    </div>

    <div id="app" class="w-full h-full relative z-10 overflow-y-auto custom-scrollbar"></div>

    <div id="nav-footer" class="hidden fixed bottom-0 left-0 w-full p-6 z-50 bg-[#020617]/95 border-t border-white/5 flex justify-between items-center backdrop-blur-xl">
        <div id="counter" class="font-title text-xl text-white w-28">01 <span class="text-gray-600 text-sm">/ 14</span></div>
        <div class="flex gap-4">
            <button onclick="navigate(-1)" class="p-4 border border-white/10 hover:bg-white/5 text-white rounded-full transition-colors"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <button id="btn-next" onclick="navigate(1)" class="px-8 py-4 bg-white text-black font-black hover:scale-105 transition-all rounded-full flex items-center gap-3 shadow-[0_0_20px_rgba(255,255,255,0.2)]">SUIVANT <i data-lucide="arrow-right" class="w-5 h-5"></i></button>
        </div>
        <div class="absolute top-0 left-0 h-[2px] bg-blue-500 transition-all duration-300" id="progress-bar" style="width: 0%"></div>
    </div>

    <script>
        const MARKET_DB_FR = {
            'paris': { rival: 'Agences PropTech', loss: '250 000', gain: '2M', traffic_gap: '-82%', pos_gap: '15 vs 1' },
            'lyon': { rival: 'Mandataires Haut de Gamme', loss: '145 000', gain: '1.2M', traffic_gap: '-76%', pos_gap: '12 vs 1' },
            'marseille': { rival: 'Réseaux Digitalisés', loss: '120 000', gain: '900k', traffic_gap: '-68%', pos_gap: '9 vs 2' },
            'bordeaux': { rival: 'Agences Locales Élites', loss: '160 000', gain: '1.4M', traffic_gap: '-75%', pos_gap: '8 vs 1' },
            'default': { rival: 'Réseaux Mandataires (IAD/Safti)', loss: '95 000', gain: '650k', traffic_gap: '-65%', pos_gap: '7 vs 2' }
        };

        let STATE = { step: 0, geo: { ville: '', quartier: '' }, name: '', claim_share: '', data: {}, curr: '€' };
        let currentIndex = 0;
        let slides = [];
        let analysisDate = null;

        function wrapContent(htmlContent) {
            return `<div class="min-h-full w-full flex flex-col items-center justify-center py-32 md:py-40 px-4 md:px-8 pb-32">
                        ${htmlContent}
                    </div>`;
        }

        function initFR() {
            renderDetailsForm();
        }

        function renderDetailsForm() {
            const html = `
                <div class="glass-panel p-10 max-w-4xl w-full animate-enter rounded-3xl">
                    <h2 class="text-4xl md:text-5xl font-title mb-2 uppercase text-white tracking-tighter">AUDIT <span class="text-blue-500">FRANCE 2026</span></h2>
                    <p class="text-[10px] text-gray-400 uppercase font-bold mb-10 tracking-[0.3em] border-b border-white/10 pb-6">Initialisation des paramètres de ciblage local</p>
                    
                    <div class="grid grid-cols-2 gap-8 mb-8">
                        <div><label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block tracking-wider">Cible (Nom Agence / Mandataire)</label><input id="inp-name" class="input-quantum w-full p-4 rounded-xl text-lg font-bold" placeholder="ex: Elite Immobilier"></div>
                        <div><label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block tracking-wider">Claim Part de Marché (Interne)</label><input id="inp-claim" class="input-quantum w-full p-4 rounded-xl text-lg" placeholder="ex: 20%"></div>
                        <div><label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block tracking-wider">Ville</label><input id="inp-ville" class="input-quantum w-full p-4 rounded-xl" placeholder="ex: Lyon"></div>
                        <div><label class="text-[10px] text-gray-400 uppercase font-bold mb-2 block tracking-wider">Quartier / Arrondissement</label><input id="inp-quartier" class="input-quantum w-full p-4 rounded-xl" placeholder="ex: 6ème Arrondissement"></div>
                    </div>
                    <button onclick="runAnalysis()" class="w-full bg-white text-black hover:bg-gray-200 font-black text-xl py-5 rounded-xl uppercase tracking-widest transition-all shadow-[0_0_30px_rgba(255,255,255,0.15)]">EXÉCUTER L'ANALYSE DE RENTABILITÉ</button>
                </div>`;
            document.getElementById('app').innerHTML = wrapContent(html);
            lucide.createIcons();
        }

        function runAnalysis() {
            STATE.name = document.getElementById('inp-name').value || "Agence Auditée";
            STATE.claim_share = document.getElementById('inp-claim').value || "15%";
            STATE.geo.ville = document.getElementById('inp-ville').value || "Paris";
            STATE.geo.quartier = document.getElementById('inp-quartier').value || "Centre-ville";
            
            const cityKey = STATE.geo.ville.toLowerCase().trim();
            STATE.data = MARKET_DB_FR[cityKey] || MARKET_DB_FR['default'];
            analysisDate = new Date(); 

            const app = document.getElementById('app');
            const html = `
                <div class="text-center max-w-2xl mx-auto px-6 animate-enter">
                    <div class="w-24 h-24 border-2 border-gray-800 border-t-blue-500 rounded-full animate-spin mx-auto mb-10 shadow-[0_0_30px_rgba(59,130,246,0.3)]"></div>
                    <h2 class="text-2xl font-title text-white mb-6 tracking-[0.2em] uppercase">EXTRACTION DATA : <span class="text-blue-400">${STATE.geo.ville.toUpperCase()}</span></h2>
                    <div class="w-full bg-black/50 rounded-full h-1 mb-4 border border-white/10"><div id="load-bar" class="h-full bg-blue-500 shadow-[0_0_15px_#3b82f6] transition-all" style="width:0%"></div></div>
                    <p class="font-mono text-xs text-gray-500 tracking-wider text-left pl-4" id="load-log">> Ping serveurs SeLoger/Leboncoin...</p>
                </div>`;
            app.innerHTML = wrapContent(html);

            let progress = 0;
            const logs = [
                `> Analyse des volumes de transactions locales...`,
                `> Scraping de l'empreinte digitale vs ${STATE.data.rival}...`,
                `> Évaluation des failles de conversion (Trafic -> Mandat)...`,
                `> Modélisation financière du manque à gagner...`,
                `> Synthèse stratégique prête.`
            ];
            
            const timer = setInterval(() => {
                progress += 2;
                document.getElementById('load-bar').style.width = progress + '%';
                if(progress % 20 === 0 && logs[(progress/20)-1]) document.getElementById('load-log').innerText = logs[(progress/20)-1];
                if(progress >= 100) { clearInterval(timer); buildSlides(); showPresentation(); }
            }, 30);
        }

        function buildSlides() {
            slides = [
                { type: 'cover', title: "", subtitle: "", tag: "RESTREINT : DIRECTION" },
                { type: 'macro', title: "LE MARCHÉ FR 2026", subtitle: "RÉALITÉ MACROÉCONOMIQUE", points: [
                    "Effondrement des volumes (-30% depuis 2023). Le marché s'est nettoyé.",
                    "Fin de l'ère des amateurs. Seuls les acteurs à fort Brand Equity survivent.",
                    "Winner-Takes-All : 20% des agences captent 80% des mandats exclusifs.",
                    "L'acquisition de mandats n'est plus un problème de prospection, c'est un problème d'algorithme."
                ]},
                { type: 'scepticisme', title: "DISCRÉPANCE LOCALE", subtitle: "MÉTHODOLOGIE : SCEPTICISME PROFESSIONNEL", insight: "Conclusion de l'audit : Illusion de contrôle. Vos parts de marché sont virtuellement siphonnées." },
                { type: 'menace', title: "LA MENACE", subtitle: "ASYMÉTRIE TECHNOLOGIQUE", rival: "", rival_stat: "70%", rival_desc: "", urgency: "L'invisibilité n'est pas une stratégie." },
                { type: 'comparison', title: "LE CLASH DES MODÈLES", subtitle: "AGENCE TRADITIONNELLE VS SYSTÈME QUANTUM" },
                { type: 'calculator', title: "HÉMORRAGIE FINANCIÈRE", subtitle: "CALCUL DU DÉFICIT D'ACQUISITION", base_commission: 12000, desc: "Ajustez votre volume de transactions annuel visé :" },
                { type: 'diagnostic', title: "AUTO-DIAGNOSTIC", subtitle: "IDENTIFICATION DU GOULOT D'ÉTRANGLEMENT", selected: null },
                { type: 'ia-automation', title: "DÉLÉGATION ALGORITHMIQUE", subtitle: "REMPLACER L'HUMAIN LÀ OÙ IL EST FAIBLE" },
                { type: 'checklist', title: "PLAN D'EXÉCUTION", subtitle: "COMMENT REPRENDRE LE CONTRÔLE (4 PILIERS)" },
                { type: 'metrics', title: "PROJECTIONS DATA", subtitle: "ROI ATTENDU À 90 JOURS", items: [{val: "+400%", label: "Trafic Qualifié", sub: "Ciblage Local"}, {val: "15+", label: "Leads Vendeurs", sub: "Par mois (IA Filtrée)"}, {val: "x10", label: "Multiplicateur", sub: "Sur investissement"}] },
                { type: 'roadmap', title: "ROADMAP 90 JOURS", subtitle: "DÉPLOIEMENT & SCALABILITÉ" },
                { type: 'guarantee', title: "SÉCURITÉ ABSOLUE", subtitle: "MODÈLE BASÉ SUR LA PERFORMANCE", offer: ["Audit stratégique de positionnement", "Infrastructure Vidéo (Qualité Cinéma Netflix)", "Déploiement du Bot de Qualification IA"], text: "GARANTIE RÉSULTAT OU REMBOURSEMENT" },
                { type: 'cta', title: "DÉCISION", choiceA: {title: "STATU QUO", price: ""}, choiceB: {title: "PIVOT QUANTUM", price: ""} },
                { type: 'final', title: "EXÉCUTION", subtitle: "La théorie est terminée. Passez à l'intégration." }
            ];
        }

        function personalizeSlides() {
            if(!STATE.data || !slides.length) return;
            const D = STATE.data;
            const q = STATE.geo.quartier.toUpperCase();
            const loc = STATE.geo.ville.toUpperCase();

            slides[0].title = `DOMINATION ${loc}`;
            slides[0].subtitle = `DIAGNOSTIC : ${STATE.name.toUpperCase()} (${q})`;

            slides[2].loc = q;
            slides[2].claim = STATE.claim_share;
            slides[2].rival = D.rival;
            slides[2].traffic = D.traffic_gap;
            slides[2].pos = D.pos_gap;

            slides[3].rival_desc = `Les ${D.rival} contrôlent l'attention digitale sur ${loc}. Ils ne prospectent plus, ils convertissent le trafic entrant.`;
            
            slides[12].choiceA.price = `PERTE EST. : ${D.loss}${STATE.curr}/AN`;
            slides[12].choiceB.price = `UPSIDE : ${D.gain}${STATE.curr}`;
        }

        window.updateCalculator = function(val) {
            STATE.calc_volume = val;
            const slide = slides.find(s => s.type === 'calculator');
            const lossRate = 0.60; // 60% market share lost to top players
            const totalLost = Math.floor(val * slide.base_commission * lossRate);
            
            document.getElementById('calc-vol-display').innerText = val;
            document.getElementById('calc-loss-display').innerText = new Intl.NumberFormat('fr-FR').format(totalLost) + STATE.curr;
            
            const warningEl = document.getElementById('calc-warning');
            if (val > 15) {
                warningEl.innerHTML = `<span class="text-red-500 glitch-text">ALERTE CRITIQUE : Vous financez l'expansion digitale de vos concurrents directs.</span>`;
            } else {
                warningEl.innerHTML = `Ce capital est absorbé par ceux qui maîtrisent l'attention en 2026.`;
            }
        };

        window.selectDiagnostic = function(choice) {
            STATE.diagnostic = choice;
            document.querySelectorAll('.diag-btn').forEach(b => {
                b.classList.remove('border-blue-500', 'bg-blue-900/40');
                b.classList.add('border-white/10', 'bg-white/5');
            });
            const activeBtn = document.getElementById(`diag-${choice}`);
            activeBtn.classList.remove('border-white/10', 'bg-white/5');
            activeBtn.classList.add('border-blue-500', 'bg-blue-900/40', 'shadow-[0_0_20px_rgba(59,130,246,0.3)]');
            setTimeout(() => navigate(1), 400);
        };

        function addCountdown() {
            if(!analysisDate) return 90;
            const remaining = Math.max(0, 90 - Math.floor((new Date() - analysisDate) / 86400000));
            if(slides[12]) slides[12].urgency = `${remaining} JOURS RESTANTS - ONBOARDING LIMITÉ`;
        }

        function showPresentation() { document.getElementById('nav-footer').classList.remove('hidden'); renderSlide(); }

        function renderSlide() {
            personalizeSlides();
            addCountdown();

            if(currentIndex >= slides.length) currentIndex = 0;
            if(currentIndex < 0) currentIndex = slides.length - 1;
            const s = slides[currentIndex];
            const app = document.getElementById('app');
            let html = '';

            if(s.type === 'cover') {
                html = `<div class="text-center animate-enter px-6 max-w-5xl w-full">
                    <div class="inline-block border border-red-500/30 px-6 py-2 text-xs text-red-400 font-bold tracking-[0.3em] uppercase mb-12 bg-red-900/10 rounded-full">${s.tag}</div>
                    <h1 class="text-5xl md:text-8xl font-title text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-500 mb-6 leading-none uppercase drop-shadow-2xl">${s.title}</h1>
                    <div class="h-[1px] w-40 bg-blue-500 mx-auto mb-8"></div>
                    <p class="text-xl md:text-2xl text-gray-300 font-light max-w-2xl mx-auto tracking-widest uppercase font-title">${s.subtitle}</p>
                </div>`;
            }
            else if (s.type === 'macro') {
                html = `<div class="w-full max-w-5xl px-6 animate-enter">
                    <h2 class="text-4xl md:text-5xl font-title text-white mb-2 text-center uppercase">${s.title}</h2>
                    <p class="text-[10px] tracking-[0.3em] text-blue-400 mb-12 text-center uppercase font-bold">${s.subtitle}</p>
                    <div class="glass-panel p-10 rounded-2xl border border-white/10 bg-black/40">
                        <ul class="space-y-6">
                            ${s.points.map(p => `
                            <li class="flex items-start gap-4 text-gray-300">
                                <i data-lucide="target" class="w-6 h-6 text-red-500 shrink-0 mt-0.5"></i>
                                <span class="text-lg md:text-xl font-light leading-relaxed">${p}</span>
                            </li>`).join('')}
                        </ul>
                    </div>
                </div>`;
            }
            else if(s.type === 'scepticisme') {
                html = `<div class="w-full max-w-6xl px-4 animate-enter">
                <h2 class="text-4xl md:text-5xl font-title text-white mb-2 text-center uppercase">${s.title}</h2>
                <p class="text-[10px] tracking-[0.3em] text-blue-400 mb-10 text-center uppercase font-bold">${s.subtitle}</p>
                <div class="glass-panel overflow-auto custom-scrollbar rounded-2xl border border-white/10 shadow-[0_0_30px_rgba(0,0,0,0.8)] w-full max-h-[60vh]">
                    <div class="min-w-[700px]">
                        <div class="grid grid-cols-4 bg-white/5 p-5 border-b border-white/10 text-[10px] md:text-xs font-black tracking-widest text-gray-400 uppercase">
                            <div>Métrique (${s.loc})</div><div>Croyance Interne</div><div>Réalité Data</div><div>Statut</div>
                        </div>
                        <div class="grid grid-cols-4 p-6 border-b border-white/5 items-center bg-red-900/5">
                            <div class="text-xs text-gray-300 font-bold uppercase">Part de Marché</div>
                            <div class="text-lg text-white font-title">${s.claim}</div>
                            <div class="text-sm text-gray-400">Position ${s.pos}</div>
                            <div class="text-xl glitch-text font-title font-black">SURÉVALUÉ</div>
                        </div>
                        <div class="grid grid-cols-4 p-6 border-b border-white/5 items-center">
                            <div class="text-xs text-gray-300 font-bold uppercase">Acquisition Digitale</div>
                            <div class="text-lg text-white font-title">Suffisante</div>
                            <div class="text-sm text-gray-400">${s.traffic} vs ${s.rival}</div>
                            <div class="text-xl text-red-500 font-title font-black">CRITIQUE</div>
                        </div>
                        <div class="grid grid-cols-4 p-6 items-center">
                            <div class="text-xs text-gray-300 font-bold uppercase">Processus de Vente</div>
                            <div class="text-lg text-white font-title">Manuel</div>
                            <div class="text-sm text-gray-400">0% Qualification IA</div>
                            <div class="text-xl text-orange-400 font-title font-black">OBSOLÈTE</div>
                        </div>
                    </div>
                </div>
                <div class="mt-8 text-center"><span class="text-xs text-red-300 border border-red-500/30 px-6 py-3 rounded bg-red-900/20 font-mono tracking-widest uppercase">⚠️ ${s.insight}</span></div></div>`;
            }
            else if(s.type === 'menace') {
                html = `<div class="w-full max-w-5xl px-6 animate-enter text-center">
                    <h2 class="text-5xl font-title text-white mb-4 uppercase">${s.title}</h2>
                    <p class="text-[10px] tracking-[0.3em] text-gray-500 mb-12 uppercase font-bold">${s.subtitle}</p>
                    <div class="glass-panel p-16 border border-white/10 rounded-2xl relative overflow-hidden bg-black/40">
                        <h3 class="text-2xl font-title text-gray-400 mb-6 uppercase">LE VRAI PROBLÈME :</h3>
                        <p class="text-3xl md:text-5xl text-white font-black mb-8 leading-tight font-title">${s.rival_desc}</p>
                        <div class="inline-block bg-red-600/20 border border-red-500/50 px-6 py-3 rounded-lg text-red-400 font-mono text-sm tracking-widest uppercase shadow-[0_0_20px_rgba(239,68,68,0.2)]">${s.urgency}</div>
                    </div>
                </div>`;
            }
            else if (s.type === 'comparison') {
                html = `<div class="w-full max-w-6xl px-6 animate-enter">
                    <h2 class="text-4xl md:text-5xl font-title text-white mb-2 text-center uppercase">${s.title}</h2>
                    <p class="text-[10px] tracking-[0.3em] text-blue-400 mb-10 text-center uppercase font-bold">${s.subtitle}</p>
                    <div class="glass-panel p-4 md:p-8 rounded-2xl border border-white/10 overflow-auto custom-scrollbar max-h-[60vh]">
                        <table class="quantum-table min-w-[800px]">
                            <thead>
                                <tr>
                                    <th>Métrique</th>
                                    <th style="color: #ef4444;">Le Passé (Statu Quo)</th>
                                    <th style="color: #60a5fa; background: rgba(59,130,246,0.1);">Le Futur (Système Quantum)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><strong>Prospection</strong></td>
                                    <td class="text-gray-400">Pige froide, boîtes aux lettres, porte-à-porte. (Rejet 99%)</td>
                                    <td class="text-blue-100" style="background: rgba(59,130,246,0.05);">Inbound. Les vendeurs vous contactent par autorité.</td>
                                </tr>
                                <tr>
                                    <td><strong>Qualification</strong></td>
                                    <td class="text-gray-400">Temps humain gaspillé au téléphone avec des curieux.</td>
                                    <td class="text-blue-100" style="background: rgba(59,130,246,0.05);">IA Bot 24/7. Ne parle qu'aux vendeurs prêts à signer.</td>
                                </tr>
                                <tr>
                                    <td><strong>Scalabilité</strong></td>
                                    <td class="text-gray-400">Limitée par le temps physique de l'agent (Burnout).</td>
                                    <td class="text-blue-100" style="background: rgba(59,130,246,0.05);">Infinie. Le contenu travaille pendant que vous dormez.</td>
                                </tr>
                                <tr>
                                    <td><strong>Brand Equity</strong></td>
                                    <td class="text-gray-400">Perçu comme un "vendeur" standard. Négociation d'honoraires.</td>
                                    <td class="text-blue-100" style="background: rgba(59,130,246,0.05);">Perçu comme l'Expert Local (#1). Honoraires pleins justifiés.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }
            else if(s.type === 'calculator') {
                html = `<div class="w-full max-w-5xl px-6 animate-enter text-center">
                    <h2 class="text-4xl md:text-5xl font-title text-white mb-2 uppercase">${s.title}</h2>
                    <p class="text-[10px] tracking-[0.3em] text-red-400 mb-12 uppercase font-bold">${s.subtitle}</p>
                    <div class="glass-panel p-10 rounded-2xl border border-red-500/30 relative overflow-hidden">
